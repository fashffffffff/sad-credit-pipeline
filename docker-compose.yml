# Запуск: docker compose up --build   → http://localhost:8080 (порт: FRONT_PORT)
# Секреты по умолчанию — демонстрационные (значения по умолчанию из кода). Свои задаёт файл .env рядом или переменные окружения.
# Боевой запуск: APP_ENV=production docker compose up — со слабыми секретами сервисы откажутся стартовать.
#
# Сети: default — фронт и backend; inner — внутренняя (internal: true, наружу выхода нет): backend и Go-сервисы.
# Порты СМЭВ, БКИ и токенизатора наружу не публикуются.
x-go-service: &go-service
  build: {context: ., target: services}
  restart: unless-stopped
  networks: [inner]

services:
  smev:
    <<: *go-service
    command: smev
    environment:
      APP_ENV: ${APP_ENV:-development}
      SMEV_HMAC_SECRET: ${SMEV_HMAC_SECRET:-dev-smev-secret}
      BIND_HOST: 0.0.0.0      # внутри контейнера слушаем все интерфейсы, но сеть inner закрытая
      SMEV_PORT: "8101"
      # /chaos пускаем только из внутренней сети (туда входит backend)
      CHAOS_ALLOW_NETS: 172.31.0.0/24
    healthcheck: &go-health
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8101/health"]
      interval: 5s
      retries: 10

  bki:
    <<: *go-service
    command: bki
    environment:
      APP_ENV: ${APP_ENV:-development}
      BKI_HMAC_SECRET: ${BKI_HMAC_SECRET:-dev-bki-secret}
      BIND_HOST: 0.0.0.0
      BKI_PORT: "8102"
      CHAOS_ALLOW_NETS: 172.31.0.0/24
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8102/health"]

  tokenizer:
    <<: *go-service
    command: tokenizer
    environment:
      APP_ENV: ${APP_ENV:-development}
      TOKENIZER_HMAC_SECRET: ${TOKENIZER_HMAC_SECRET:-dev-tokenizer-secret}
      OPRF_PRIVATE_KEY: ${OPRF_PRIVATE_KEY:-}   # пусто — ключ создаётся в томе и переживает перезапуск
      OPRF_KEY_FILE: /data/oprf.key
      BIND_HOST: 0.0.0.0
      TOKENIZER_PORT: "8103"
    volumes: ["tokenizer-data:/data"]
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8103/health"]

  backend:
    build: {context: ., target: backend}
    restart: unless-stopped
    # --forwarded-allow-ips: верим заголовку X-Forwarded-For только от nginx из сети compose. Без этого все клиенты
    # выглядят как один IP (адрес nginx), и лимит «10 попыток входа в минуту с IP» блокирует всех сразу
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips 172.30.0.0/24
    networks: [default, inner]
    environment:
      SMEV_URL: http://smev:8101
      BKI_URL: http://bki:8102
      TOKENIZER_URL: http://tokenizer:8103
      APP_ENV: ${APP_ENV:-development}
      SMEV_HMAC_SECRET: ${SMEV_HMAC_SECRET:-dev-smev-secret}
      BKI_HMAC_SECRET: ${BKI_HMAC_SECRET:-dev-bki-secret}
      TOKENIZER_HMAC_SECRET: ${TOKENIZER_HMAC_SECRET:-dev-tokenizer-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      PII_PEPPER: ${PII_PEPPER:-dev-pii-pepper}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # вход клиента (раздел 6.2 контракта); пустые значения = способ не настроен
      AUTH_DEMO: ${AUTH_DEMO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      CERT_SIGNING_KEY: ${CERT_SIGNING_KEY:-}
      DUPLICATE_CHECK: ${DUPLICATE_CHECK:-on}
      # учётки генерируются при первом запуске в томе с базой: docker compose exec backend cat /data/credentials.local.md
      CREDENTIALS_FILE: /data/credentials.local.json
      DATABASE_PATH: /data/credit_v6.sqlite
    volumes: ["backend-data:/data"]   # база переживает перезапуск
    depends_on:
      smev: {condition: service_healthy}
      bki: {condition: service_healthy}
      tokenizer: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 5s
      retries: 20

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${FRONT_PORT:-8080}:80"]   # наружу только фронт; остальное — внутри сети compose

volumes:
  backend-data:
  tokenizer-data:

networks:
  default:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  inner:
    internal: true   # без выхода наружу; публикация портов на ней невозможна
    ipam:
      config: [{subnet: 172.31.0.0/24}]
