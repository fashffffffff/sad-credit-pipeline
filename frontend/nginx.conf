server {
    listen 80;
    server_tokens off;            # не сообщаем версию nginx
    client_max_body_size 128k;    # анкета маленькая; backend сам режет всё, что больше 64 КБ

    # Заголовки безопасности. CSP: скрипты, стили, шрифты и запросы только с нашего домена; даже если в страницу
    # когда-нибудь попадёт чужой <script>, браузер его не выполнит. 'unsafe-inline' нужен только стилям (графики, Svelte).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    root /usr/share/nginx/html;

    # статика, любой неизвестный путь отдаёт index.html (одностраничное приложение)
    location / {
        try_files $uri /index.html;
    }

    # API проксируем в backend; для SSE (живые события) буферизацию выключаем
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # перезаписываем (а не дополняем) заголовок: клиент не сможет подсунуть чужой IP и обойти лимит входа
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
